plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom сам добавляет репозитории Mojang и Fabric.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.mod_version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// ---------------------------------------------------------------------------
// Публикация: ./gradlew build publishMods
// Токены берутся из переменных окружения (в GitHub Actions — из секретов репозитория):
//   MODRINTH_TOKEN, CURSEFORGE_TOKEN, GITHUB_TOKEN.
// Площадка подключается, только если в gradle.properties заполнен её ID.
// Текст изменений версии — RELEASE_NOTES.md.
// ---------------------------------------------------------------------------
publishMods {
	file = jar.archiveFile
	displayName = "Lily Bloom ${project.mod_version}"
	changelog = providers.fileContents(layout.projectDirectory.file("RELEASE_NOTES.md")).asText
	type = STABLE
	modLoaders.add("fabric")

	if (project.findProperty("modrinth_id")) {
		modrinth {
			accessToken = providers.environmentVariable("MODRINTH_TOKEN")
			projectId = project.modrinth_id
			minecraftVersions.add(project.minecraft_version)
			environment = CLIENT_AND_SERVER
			requires("fabric-api")
			additionalFile(sourcesJar) {
				type = SOURCES_JAR
			}
		}
	}

	if (project.findProperty("curseforge_id")) {
		curseforge {
			accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
			projectId = project.curseforge_id
			minecraftVersions.add(project.minecraft_version)
			javaVersions.add(JavaVersion.VERSION_25)
			client = true
			server = true
			requires("fabric-api")
		}
	}

	if (project.findProperty("github_repo")) {
		github {
			accessToken = providers.environmentVariable("GITHUB_TOKEN")
			repository = project.github_repo
			commitish = "main"
			tagName = "v${project.version}"
			additionalFiles.from(sourcesJar.archiveFile)
		}
	}
}
